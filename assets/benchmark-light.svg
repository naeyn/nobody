<rect width="920" height="556" fill="#fcfcfb" rx="8"/>
<rect x="0.5" y="0.5" width="919" height="555" fill="none" stroke="rgba(11,11,11,0.10)" rx="8"/>
<text x="32" y="44" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="18" font-weight="600" fill="#0b0b0b" text-anchor="start">Three PII models, one pipeline — protocol v2</text>
<text x="32" y="66" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Full production pipeline (deterministic checksum layer + model), one pre-registered policy, no per-benchmark tuning.</text>
<text x="32" y="82" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="12.5" font-weight="400" fill="#52514e" text-anchor="start">Leakage = share of gold PII tokens missed — lower is better. Whiskers: 95% bootstrap CI, 10,000 doc-level resamples.</text>
<text x="32" y="116" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="13" font-weight="600" fill="#0b0b0b" text-anchor="start">Real German data (ai4privacy)†</text>
<text x="32" y="133" font-family="system-ui, -apple-system, &quot;Segoe UI&quot;, sans-serif" font-size="11" font-weight="400" fill="#898781" text-anchor="start">n=3,000 — the honest extended set; Piiranha's home distribution</text>
